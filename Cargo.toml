[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/yuno7777/swarm-platform"

[workspace.dependencies]
# internal
swarm-domain = { path = "crates/domain" }
swarm-task-queue = { path = "crates/task-queue" }
swarm-shared-memory = { path = "crates/shared-memory" }
swarm-model-gateway = { path = "crates/model-gateway" }
swarm-agent-runtime = { path = "crates/agent-runtime" }
swarm-coordinator = { path = "crates/coordinator" }

# runtime
tokio = { version = "1", default-features = false }
async-trait = "0.1"
futures = "0.3"

# data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
petgraph = "0.6"
dashmap = "6"

# errors, cli, logs
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
